<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHire AI - AI-Powered Mock Interview Platform</title>
    <meta http-equiv="refresh" content="0; url=frontend/index.html">
    <script>
        window.location.href = "frontend/index.html";
    </script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            max-width: 450px;
        }
        h2 { color: #38bdf8; margin-top: 0; }
        a { color: #38bdf8; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="redirect-box">
        <h2>SmartHire AI Platform</h2>
        <div class="spinner"></div>
        <p>Redirecting to SmartHire AI Portal...</p>
        <p>If you are not redirected automatically, <a href="frontend/index.html">click here to open SmartHire AI</a>.</p>
    </div>
</body>
</html>
