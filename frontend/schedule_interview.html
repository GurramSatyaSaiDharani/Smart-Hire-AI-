<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Candidate Interview - Smart Hire AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <div class="logo-icon">SH</div>
            <span>Smart Hire AI</span>
        </a>
        <ul class="navbar-nav">
            <li><a href="recruiter.html">Recruiter Dashboard</a></li>
            <li><a href="view_candidates.html">Candidate Roster</a></li>
            <li><a href="view_reports.html">Reports Vault</a></li>
        </ul>
    </nav>

    <div class="app-container">
        <div class="card" style="max-width: 700px; margin: auto;">
            <div class="card-header">
                <h2>📅 Schedule Candidate Interview</h2>
            </div>
            
            <form id="scheduleInterviewForm" onsubmit="handleScheduleSubmit(event)">
                <div class="form-group">
                    <label class="form-label">Candidate Full Name *</label>
                    <input type="text" id="schedCandidateName" placeholder="e.g. Alice Johnson" class="form-control" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Candidate Email *</label>
                    <input type="email" id="schedCandidateEmail" placeholder="e.g. alice@example.com" class="form-control" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label class="form-label">Interview Date *</label>
                        <input type="date" id="schedInterviewDate" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Interview Time *</label>
                        <input type="time" id="schedInterviewTime" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Recruiter / Interviewer Name</label>
                    <input type="text" id="schedRecruiterName" placeholder="e.g. Sarah Jenkins (Senior Technical Recruiter)" class="form-control">
                </div>

                <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #166534; font-weight: 600; cursor: pointer;">
                        <input type="checkbox" checked id="schedSendEmailCheck"> 📧 Send Instant Email Notification & Calendar Invitation
                    </label>
                    <span class="badge badge-green">SMTP / Dev Logger Active</span>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 15px;">
                    🗓️ Confirm & Schedule Interview (Dispatches Email)
                </button>
            </form>

            <br>
            <button onclick="window.location.href='recruiter.html'" class="btn btn-secondary" style="width: 100%;">
                ⬅️ Back to Recruiter Dashboard
            </button>
        </div>

        <br>

        <!-- Scheduled Interviews List Table -->
        <div class="card" style="max-width: 900px; margin: auto;">
            <div class="card-header">
                <h2>📋 Scheduled Candidate Interviews</h2>
                <button onclick="loadScheduledInterviewsList()" class="btn btn-secondary" style="font-size: 13px; padding: 6px 14px;">🔄 Refresh List</button>
            </div>
            <div class="table-responsive">
                <table class="vault-table">
                    <thead>
                        <tr>
                            <th>Candidate</th>
                            <th>Interviewer</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Reminder</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="schedTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; padding: 20px; color: var(--text-muted);">
                                Loading scheduled interviews from database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="toast.js"></script>
    <script src="script.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Set default date to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('schedInterviewDate').value = tomorrow.toISOString().split('T')[0];
            document.getElementById('schedInterviewTime').value = "10:00";
            
            const rName = localStorage.getItem("username");
            if (rName) document.getElementById('schedRecruiterName').value = rName;

            loadScheduledInterviewsList();
        });
    </script>
</body>
</html>
