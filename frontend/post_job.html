<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Job - Smart Hire AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <div class="logo-icon">SH</div>
            <span>Smart Hire AI</span>
        </a>
        <ul class="navbar-nav">
            <li><a href="recruiter.html">Recruiter Dashboard</a></li>
        </ul>
    </nav>

    <div class="app-container">
        <div class="card" style="max-width: 650px; margin: auto;">
            <div class="card-header">
                <h2>Post New Job Opportunity</h2>
            </div>
            
            <div class="form-group">
                <label class="form-label">Job Title</label>
                <input type="text" placeholder="e.g. Senior Frontend Developer" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">Department / Category</label>
                <input type="text" placeholder="e.g. Engineering" class="form-control">
            </div>

            <div class="form-group">
                <label class="form-label">Job Description & Requirements</label>
                <textarea class="form-control" style="height: 120px;" placeholder="Enter job description..."></textarea>
            </div>

            <button onclick="alert('Job Opportunity Posted Successfully!')" class="btn btn-primary" style="width: 100%;">
                Publish Job Listing
            </button>

            <br><br>
            <button onclick="window.location.href='recruiter.html'" class="btn btn-secondary" style="width: 100%;">
                Back to Recruiter Dashboard
            </button>
        </div>
    </div>

</body>
</html>
