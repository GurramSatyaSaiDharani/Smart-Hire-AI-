<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Resume - Smart Hire AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <div class="logo-icon">SH</div>
            <span>Smart Hire AI</span>
        </a>
        <ul class="navbar-nav">
            <li><a href="candidate.html">Candidate Dashboard</a></li>
        </ul>
    </nav>

    <div class="app-container">
        <div class="card" style="max-width: 600px; margin: auto;">
            <div class="card-header">
                <h2>Upload Candidate Resume</h2>
            </div>
            
            <div class="form-group">
                <label class="form-label">Select Resume File (PDF, DOCX)</label>
                <input type="file" id="resumeFile" class="form-control">
            </div>

            <button onclick="alert('Resume Uploaded Successfully!')" class="btn btn-primary" style="width: 100%;">
                Upload Resume
            </button>

            <br><br>
            <button onclick="window.location.href='candidate.html'" class="btn btn-secondary" style="width: 100%;">
                Back to Dashboard
            </button>
        </div>
    </div>

</body>
</html>
